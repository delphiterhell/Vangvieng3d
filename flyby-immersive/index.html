<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vang Vieng — Immersive flight (esperimento)</title>
  <!-- Fotografia e modello sono quelli di depth-version: non vengono duplicati -->
  <link rel="preload" as="image" href="../depth-version/images/landscape.jpg">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- La lunghezza di questa sezione è la "durata" del volo -->
  <main class="flight">
    <div class="stage">

      <!-- Fallback statico: fotografia e mongolfiera in HTML. Resta visibile
           durante il caricamento e se WebGL non è disponibile -->
      <div class="world">
        <img class="fallback" src="../depth-version/images/landscape.jpg" alt="Alba sulle montagne carsiche di Vang Vieng, Laos">
        <div class="layer balloon-layer">
          <div class="balloon-path">
            <img class="balloon" src="../depth-version/images/balloon.png" alt="Mongolfiera rossa in volo">
          </div>
        </div>
      </div>

      <!-- SCENA 3D: la fotografia come panorama lontano, la mongolfiera GLB
           e la foschia; lo scroll muove la telecamera lungo il percorso -->
      <canvas class="layer gl" aria-hidden="true"></canvas>

      <div class="layer vignette" aria-hidden="true"></div>

      <div class="loader" role="status" aria-live="polite"></div>
      <div class="scroll-hint" aria-hidden="true"><span></span></div>
      <div class="scene-error" role="alert" hidden></div>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="module" src="script.js?v=20261009-1"></script>
</body>
</html>
